<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Orbit · DMs</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/orbit.css">
  <link rel="stylesheet" href="css/convo.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; min-height: 0; }
    .dm-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px 1fr; }

    .dm-side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
    .side-head { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
    .side-search { flex: 1; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-2); }
    .side-search:focus-within { border-color: #444; }
    .side-search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
    .side-search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; height: 100%; }
    .side-search input::-webkit-search-cancel-button { display: none; }
    .new-group { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text-2); display: grid; place-items: center; flex: none; }
    .new-group:hover { color: #fff; border-color: #444; }
    .new-group svg { width: 19px; height: 19px; }
    .side-scroll { flex: 1; overflow-y: auto; padding: 6px 8px calc(var(--nav-h) + 40px); }
    .side-label { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 12px 8px 6px; }
    .row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 12px; border: none; background: transparent; text-align: left; position: relative; }
    .row:hover { background: var(--surface-2); }
    .row.on { background: var(--surface-3); }
    .row .av, .row .uname { cursor: inherit; }
    .row .grow { flex: 1; min-width: 0; }
    .row .line1 { display: flex; align-items: baseline; gap: 6px; }
    .row .line1 .when { margin-left: auto; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
    .row .gname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .line2 { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .row.unread .line2 { color: var(--text); font-weight: 500; }
    .row .udot { width: 9px; height: 9px; border-radius: 50%; background: #fff; flex: none; }
    .row .online { position: absolute; left: 38px; top: 36px; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); border: 2px solid var(--bg); }
    .side-empty { font-size: 13px; color: var(--muted); padding: 6px 8px 10px; }

    .stack { position: relative; width: 40px; height: 40px; flex: none; }
    .stack .av { position: absolute; border: 2px solid var(--bg); border-radius: 50%; }
    .stack .av:nth-child(1) { left: 0; top: 0; }
    .stack .av:nth-child(2) { right: 0; bottom: 0; }
    .stack .av::after, .stack .av::before { display: none; }
    .stack.single .av { position: static; border: none; }

    .dm-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
    .dm-head { display: flex; align-items: center; gap: 10px; height: 62px; padding: 0 14px; border-bottom: 1px solid var(--line); flex: none; }
    .dm-head .grow { flex: 1; min-width: 0; }
    .dm-head .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dm-head .gname { font-weight: 600; }
    .dm-head .back { display: none; }
    .dm-empty { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px 24px calc(var(--nav-h) + 40px); color: var(--muted); }
    .dm-empty .big { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; margin: 0 auto 14px; color: var(--text-2); }
    .dm-empty .big svg { width: 28px; height: 28px; }
    .dm-empty h2 { margin: 0 0 6px; font-size: 18px; color: var(--text); font-weight: 600; }
    .dm-empty p { margin: 0 0 16px; font-size: 14px; }

    .menu { position: absolute; right: 12px; top: 56px; z-index: 30; min-width: 190px; padding: 5px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,.6); }
    .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; background: transparent; border-radius: 8px; text-align: left; font-size: 13.5px; }
    .menu button:hover { background: var(--surface-3); }
    .menu button.danger { color: var(--danger); }
    .menu svg { width: 16px; height: 16px; }

    .pick-list { max-height: 320px; overflow-y: auto; margin-top: 10px; }
    .pick { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border: none; background: transparent; border-radius: 10px; text-align: left; }
    .pick:hover { background: var(--surface-2); }
    .pick .av, .pick .uname { cursor: inherit; }
    .pick .grow { flex: 1; min-width: 0; }
    .check { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none; }
    .pick.on .check { background: #fff; border-color: #fff; }
    .pick.on .check::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #000; border-bottom: 2px solid #000; transform: rotate(-45deg) translate(1px, -1px); }
    .picked { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .picked:empty { display: none; }
    .picked .chip { padding: 4px 8px 4px 4px; gap: 6px; }

    @media (max-width: 760px) {
      .dm-layout { grid-template-columns: 1fr; }
      .dm-layout .dm-main { display: none; }
      .dm-layout.open .dm-side { display: none; }
      .dm-layout.open .dm-main { display: flex; }
      .dm-head .back { display: inline-grid; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">Orbit</a>
    <span class="title">Messages</span>
    <span class="spacer"></span>
    <span class="chat-tools-slot" id="messageTools"></span>
  </header>

  <div class="dm-layout" id="layout">
    <aside class="dm-side">
      <div class="side-head">
        <label class="side-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="sideSearch" type="search" placeholder="Search people and chats" autocomplete="off" spellcheck="false">
        </label>
        <button class="new-group" id="newGroupBtn" type="button" title="New group chat"></button>
      </div>
      <div class="side-scroll">
        <div class="side-label">Chats</div>
        <div id="convList"></div>
        <div class="side-label">People</div>
        <div id="peopleList"></div>
      </div>
    </aside>

    <section class="dm-main">
      <div class="dm-head hidden" id="dmHead"></div>
      <div class="convo hidden" id="convo"></div>
      <div class="dm-empty" id="dmEmpty">
        <div>
          <div class="big" id="emptyIcon"></div>
          <h2>Your messages</h2>
          <p>Pick someone from the list to DM them, or start a group chat.</p>
          <button class="btn" id="emptyGroupBtn" type="button">New group chat</button>
        </div>
      </div>
    </section>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/orbit.js"></script>
  <script src="js/convo.js"></script>
  <script src="js/dms.js"></script>
</body>
</html>
