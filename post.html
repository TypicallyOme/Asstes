<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit · Posts</title>
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/orbit.css">
  <style>
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 0 calc(var(--nav-h) + 60px); }
    .column { border-left: 1px solid var(--line); border-right: 1px solid var(--line); min-height: calc(100vh - 60px); }
    @media (max-width: 660px) { .column { border: none; } }

    /* composer */
    .new-thread { display: flex; gap: 12px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
    .new-thread .nt-main { flex: 1; min-width: 0; }
    .new-thread textarea {
      width: 100%; border: none; outline: none; background: transparent; resize: none; padding: 4px 0;
      min-height: 26px; max-height: 320px; font-size: 15px; line-height: 1.45;
    }
    .nt-tools { display: flex; align-items: center; gap: 2px; margin-top: 6px; margin-left: -8px; }
    .nt-tools .grow { flex: 1; }
    .nt-tools .count { font-size: 12px; color: var(--muted); margin-right: 8px; }
    .nt-pending { display: flex; gap: 8px; overflow-x: auto; margin-top: 8px; }
    .nt-pending:empty { display: none; }
    .ntp { position: relative; flex: none; width: 110px; height: 110px; border-radius: 12px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 11.5px; color: var(--text-2); text-align: center; padding: 6px; }
    .ntp img, .ntp video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ntp .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: #000c; border: none; color: #fff; display: grid; place-items: center; z-index: 2; }
    .ntp .x svg { width: 12px; height: 12px; }
    .ntp .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: #fff; z-index: 2; transition: width .2s; }
    .ntp .lbl { position: relative; z-index: 1; word-break: break-all; }
    .ntp.err { border-color: var(--danger); color: var(--danger); }
    .blocked-note { font-size: 13px; color: #f1c65a; margin-top: 6px; }

    /* thread */
    .thread { display: flex; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); position: relative; }
    .thread.flash { animation: flash 1.6s ease; }
    @keyframes flash { 0%, 40% { background: #ffffff12; } }
    .t-left { display: flex; flex-direction: column; align-items: center; width: 40px; flex: none; }
    .t-line { flex: 1; width: 2px; background: var(--line-2); border-radius: 2px; margin-top: 8px; min-height: 0; }
    .thread:not(.open) .t-line { display: none; }
    .t-main { flex: 1; min-width: 0; }
    .t-head { display: flex; align-items: center; gap: 8px; }
    .t-head .time { color: var(--muted); font-size: 13.5px; }
    .t-head .grow { flex: 1; }
    .t-head .icon-btn { width: 30px; height: 30px; margin: -4px -6px -4px 0; }
    .t-text { margin-top: 2px; }
    .t-main .atts { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scroll-snap-type: x mandatory; }
    .t-main .att { flex: none; scroll-snap-align: start; }
    .t-main .att img { max-height: 380px; }
    .t-acts { display: flex; gap: 2px; margin: 8px 0 0 -8px; }
    .t-acts button { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px; border-radius: 999px; border: none; background: transparent; color: var(--text-2); font-size: 13px; }
    .t-acts button:hover { background: var(--surface-3); color: #fff; }
    .t-acts svg { width: 19px; height: 19px; }
    .edited { font-size: 11.5px; color: var(--muted); margin-left: 6px; }

    .menu { position: absolute; right: 16px; top: 44px; z-index: 20; min-width: 170px; padding: 5px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,.6); }
    .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; background: transparent; border-radius: 8px; text-align: left; font-size: 13.5px; }
    .menu button:hover { background: var(--surface-3); }
    .menu button.danger { color: var(--danger); }
    .menu svg { width: 16px; height: 16px; }

    /* comments */
    .comments { margin-top: 6px; }
    .comment { display: flex; gap: 10px; padding: 10px 0 4px; }
    .comment .c-main { flex: 1; min-width: 0; }
    .comment .c-head { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .comment .c-head .time { color: var(--muted); font-size: 12.5px; }
    .comment .c-head .grow { flex: 1; }
    .comment .c-tools { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
    .comment:hover .c-tools { opacity: 1; }
    @media (hover: none) { .comment .c-tools { opacity: 1; } }
    .comment .c-tools button { width: 26px; height: 26px; border: none; background: transparent; color: var(--text-2); border-radius: 6px; display: grid; place-items: center; }
    .comment .c-tools button:hover { background: var(--surface-3); color: #fff; }
    .comment .c-tools svg { width: 15px; height: 15px; }
    .comment .rich { font-size: 14px; }
    .comment .reacts { margin-top: 4px; }
    .c-compose { display: flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 4px 4px 12px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--bg-2); }
    .c-compose input { flex: 1; border: none; outline: none; background: transparent; height: 32px; min-width: 0; }
    .c-compose .icon-btn { width: 32px; height: 32px; }
    .c-compose .icon-btn svg { width: 18px; height: 18px; }
    .c-empty { font-size: 13px; color: var(--muted); padding: 8px 0 0; }
    .nt-title { width: 100%; border: none; outline: none; background: transparent; font-weight: 700; font-size: 16px; padding: 4px 0 0; }
    .nt-title::placeholder { color: var(--muted); font-weight: 600; }
    .t-title { font-weight: 700; font-size: 16px; margin-top: 2px; overflow-wrap: anywhere; }

    /* search */
    .searchbar { position: sticky; top: 60px; z-index: 15; padding: 12px 18px; background: rgba(0,0,0,.86); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .search-box { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-2); transition: border-color .15s; }
    .search-box:focus-within { border-color: #444; }
    .search-box > svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
    .search-box input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; height: 100%; }
    .search-box input::-webkit-search-cancel-button { display: none; }
    .search-box .icon-btn { width: 28px; height: 28px; }
    .search-box .icon-btn svg { width: 15px; height: 15px; }
    .search-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--text-2); }
    .search-meta:empty { display: none; }
    .ppl { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 13px; }
    .ppl:hover { border-color: #555; }
    .ppl .av { cursor: inherit; }
    .ppl.on { border-color: #fff; }
    mark { background: #ffffff2e; color: #fff; border-radius: 3px; padding: 0 1px; }
    .searching .new-thread { display: none; }

    .more-wrap { display: flex; justify-content: center; padding: 18px; }
    .share-preview { border: 1px solid var(--line-2); border-radius: 14px; padding: 12px; background: var(--bg-2); margin-bottom: 12px; font-size: 14px; }
    .share-preview .rich { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; margin-top: 6px; color: var(--text-2); }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">Orbit</a>
    <span class="title">Posts</span>
    <span class="spacer"></span>
    <span class="online-pill" id="onlinePill"><span class="dot"></span><span id="onlineCount">0</span> online</span>
  </header>

  <main class="wrap">
    <div class="column" id="column">
      <div class="searchbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search posts, titles, people or @name" autocomplete="off" spellcheck="false">
          <button class="icon-btn hidden" id="searchClear" type="button" title="Clear search"></button>
        </div>
        <div class="search-meta" id="searchMeta"></div>
      </div>
      <div class="new-thread" id="newThread">
        <div id="ntAvatar"></div>
        <div class="nt-main">
          <div id="ntName"></div>
          <input id="ntTitle" class="nt-title" maxlength="100" placeholder="Title (optional)" autocomplete="off">
          <textarea id="ntText" rows="1" maxlength="5000" placeholder="Start a thread…"></textarea>
          <div class="nt-pending" id="ntPending"></div>
          <div class="blocked-note hidden" id="ntBlocked"></div>
          <div class="nt-tools">
            <button class="icon-btn" id="ntAttach" type="button" title="Add images, audio or video"></button>
            <button class="icon-btn" id="ntEmoji" type="button" title="Emojis"></button>
            <input type="file" id="ntFile" class="hidden" multiple>
            <span class="grow"></span>
            <span class="count" id="ntCount"></span>
            <button class="btn primary sm" id="ntPost" type="button" disabled>Post</button>
          </div>
        </div>
      </div>
      <div id="feed"></div>
      <div class="more-wrap hidden" id="moreWrap"><button class="btn sm" id="moreBtn">Load more</button></div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/orbit.js"></script>
  <script src="js/posts.js"></script>
</body>
</html>
