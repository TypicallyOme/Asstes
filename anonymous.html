<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Orbit · Anonymous Chat</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/orbit.css">
  <link rel="stylesheet" href="css/convo.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; min-height: 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">Orbit</a>
    <nav class="channel-tabs" aria-label="Chat channels">
      <a class="channel-tab" href="chat.html">General</a>
      <a class="channel-tab active" href="anonymous.html" aria-current="page">Anonymous Chat</a>
      <a class="channel-tab" href="omegle.html">Omegle</a>
    </nav>
    <span class="spacer"></span>
    <span class="chat-tools-slot" id="messageTools"></span>
    <button class="icon-btn search-btn" id="searchBtn" type="button" title="Search messages (Ctrl+F)"></button>
    <span class="online-pill" id="onlinePill"><span class="dot"></span><span id="onlineCount">0</span> online</span>
  </header>

  <main class="convo" id="convo"></main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/orbit.js"></script>
  <script src="js/convo.js"></script>
  <script>
    Orbit.init({ page: 'chat', require: true });
    Orbit.$('#messageTools').replaceWith(Orbit.messageTools());
    Orbit.on('change', () => { Orbit.$('#onlineCount').textContent = Orbit.onlineCount(); });
    Orbit.Conversation({
      mount: Orbit.$('#convo'),
      msgPath: 'channelMessages/anonymous',
      typingPath: 'channelTyping/anonymous',
      placeholder: 'Message anonymously',
      emptyText: 'Say hello. Your name and profile picture are shown as Anonymous here.',
      anonymous: true,
      searchBtn: Orbit.$('#searchBtn')
    });
  </script>
</body>
</html>
