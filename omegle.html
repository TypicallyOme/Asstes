<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Orbit · Omegle</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/orbit.css">
  <link rel="stylesheet" href="css/convo.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; min-height: 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">Orbit</a>
    <nav class="channel-tabs" aria-label="Chat channels">
      <a class="channel-tab" href="chat.html">General</a>
      <a class="channel-tab" href="anonymous.html">Anonymous Chat</a>
      <a class="channel-tab active" href="omegle.html" aria-current="page">Omegle</a>
    </nav>
    <span class="spacer"></span>
    <span class="omegle-toolbar">
      <span class="omegle-status" id="omegleStatus" role="status">Not connected</span>
      <button class="btn sm" id="omegleNext" type="button">Start chatting</button>
    </span>
    <span class="chat-tools-slot" id="messageTools"></span>
    <button class="icon-btn search-btn" id="searchBtn" type="button" title="Search this chat (Ctrl+F)"></button>
  </header>

  <main class="omegle-stage" id="omegleStage">
    <div class="omegle-wait" id="omegleWait"><div><strong>Meet someone new</strong><span>Start chatting to be paired with a random person. Names and profile pictures appear as Anonymous.</span></div></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/orbit.js"></script>
  <script src="js/convo.js"></script>
  <script src="js/omegle.js"></script>
</body>
</html>
