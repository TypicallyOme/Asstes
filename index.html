<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/orbit.css">
  <style>
    .hero {
      min-height: 100vh; display: grid; place-items: center; text-align: center;
      padding: 24px 16px calc(var(--nav-h) + 48px); position: relative; overflow: hidden;
    }
    .stage { position: relative; display: grid; place-items: center; }
    .ring {
      position: absolute; width: min(560px, 92vw); aspect-ratio: 2.6 / 1;
      border: 1px solid #ffffff14; border-radius: 50%;
      transform: rotate(-12deg);
    }
    .ring.r2 { width: min(760px, 120vw); border-color: #ffffff0a; transform: rotate(-12deg); }
    .ring .sat {
      position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 12px #fff; offset-path: border-box; offset-distance: 0%;
      animation: travel 9s linear infinite;
    }
    .ring.r2 .sat { width: 6px; height: 6px; background: #8a8a8a; box-shadow: none; animation-duration: 16s; animation-direction: reverse; }
    @keyframes travel { to { offset-distance: 100%; } }
    @supports not (offset-path: border-box) { .ring .sat { display: none; } }
    .big-logo {
      font-family: var(--logo); font-size: clamp(64px, 16vw, 148px); line-height: 1; margin: 0;
      color: #fff; position: relative; z-index: 1;
      text-shadow: 0 4px 0 #2a2a2a, 0 0 40px #ffffff22;
    }
    .tag { color: var(--text-2); margin: 18px 0 0; font-size: 15px; position: relative; z-index: 1; }
    .stats { display: flex; gap: 10px; justify-content: center; margin-top: 26px; position: relative; z-index: 1; flex-wrap: wrap; }
    .stat { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--text-2); background: var(--bg-2); }
    .welcome { margin-top: 14px; font-size: 14px; color: var(--muted); position: relative; z-index: 1; min-height: 20px; }
    .welcome .uname { font-size: 14px; }
  </style>
</head>
<body>
  <main class="hero">
    <div>
      <div class="stage">
        <div class="ring r2"><span class="sat"></span></div>
        <div class="ring"><span class="sat"></span></div>
        <h1 class="big-logo">Orbit</h1>
      </div>
      <p class="tag">Talk, post, and hang out — all in one orbit.</p>
      <div class="stats">
        <span class="stat"><span class="dot"></span> <b id="online">0</b> online</span>
        <span class="stat"><b id="members">0</b> members</span>
      </div>
      <div class="welcome" id="welcome"></div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/orbit.js"></script>
  <script>
    Orbit.init({ page: 'home' });
    const render = () => {
      document.getElementById('online').textContent = Object.keys(Orbit.S.presence).length;
      document.getElementById('members').textContent = Object.keys(Orbit.S.users).filter(id => Orbit.user(id)).length;
      const w = document.getElementById('welcome');
      w.innerHTML = '';
      if (Orbit.me()) w.append('Welcome back, ', Orbit.nameTag(Orbit.uid));
      else w.append(Orbit.el('a', { href: '#', onclick: e => { e.preventDefault(); Orbit.openProfile({ setup: true }); } }, 'Create your profile'), ' to start chatting');
    };
    Orbit.on('change', render);
  </script>
</body>
</html>
